name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a signed SemVer tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git verify-tag "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable tags
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/postgres-patroni/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/postgres-patroni:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/postgres-patroni:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Keyless image signature
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}/postgres-patroni@${{ steps.build.outputs.digest }}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/postgres-patroni@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: postgres-patroni.spdx.json
      - name: Copy Compose release artifact
        run: cp compose.yaml compose.release.yaml
      - name: Create digest-pinned Compose artifact
        uses: mikefarah/yq@v4
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}/postgres-patroni@${{ steps.build.outputs.digest }}
        with:
          cmd: >-
            yq -i '."x-postgres-common".image = strenv(RELEASE_IMAGE) |
            del(."x-postgres-common".build)' compose.release.yaml
      - name: Checksums
        run: sha256sum compose.release.yaml postgres-patroni.spdx.json > SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          compose.release.yaml postgres-patroni.spdx.json SHA256SUMS
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
